name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-dbus python3-gi gir1.2-nm-1.0 gir1.2-secret-1
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Version consistency
        run: |
          source packaging/PKGBUILD
          code="$(python3 -c 'import nm_openp2s; print(nm_openp2s.__version__)')"
          cmake_version="$(sed -nE 's/^project\(plasma-nm-openp2s VERSION ([0-9.]+).*/\1/p' plasma/CMakeLists.txt)"
          echo "PKGBUILD: $pkgver  code: $code  plasma: $cmake_version"
          test "$pkgver" = "$code"
          test "$pkgver" = "$cmake_version"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "${GITHUB_REF#refs/tags/v}" = "$pkgver"
          fi

  arch:
    needs: test
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v7
      - name: Build packages
        run: |
          pacman -Syu --noconfirm
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder: "$GITHUB_WORKSPACE"
          cd packaging
          sudo -u builder makepkg --syncdeps --noconfirm
      - name: Plasma plugin interface matches plasma-nm
        run: |
          version="$(pacman -Q plasma-nm | awk '{print $2}' | cut -d- -f1)"
          echo "plasma-nm $version"
          plasma/fetch-upstream-headers.sh "$version" /tmp/plasma-nm-headers
          python3 plasma/check-interface.py /tmp/plasma-nm-headers
      - name: Install and smoke test
        run: |
          pacman -U --noconfirm packaging/*.pkg.tar.zst
          nm-openp2s --version
          out="$(/usr/lib/nm-openp2s/openvpn --version || true)"
          head -1 <<<"$out"
          grep -q '^OpenVPN 2' <<<"$out"
          test -f /usr/lib/NetworkManager/VPN/nm-openp2s-service.name
          plugin=/usr/lib/qt6/plugins/plasma/network/vpn/plasmanetworkmanagement_openp2sui.so
          test -f "$plugin"
          ! ldd "$plugin" | grep 'not found'
      - uses: actions/upload-artifact@v7
        with:
          name: arch-packages
          path: packaging/*.pkg.tar.zst
          if-no-files-found: error

  deb:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build package
        run: packaging/debian/build-deb.sh dist
      - uses: actions/upload-artifact@v7
        with:
          name: deb-package
          path: dist/*.deb
          if-no-files-found: error

  deb-plasma:
    needs: test
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake pkg-config curl ca-certificates \
            dpkg-dev qt6-base-dev libkf6coreaddons-dev libkf6widgetsaddons-dev libkf6networkmanagerqt-dev \
            libnm-dev plasma-nm qt6-qpa-plugins python3 python3-gi python3-dbus gir1.2-nm-1.0
      - name: Plasma plugin interface matches plasma-nm
        run: |
          version="$(dpkg-query -W -f='${Version}' plasma-nm | sed -E 's/^[0-9]+://; s/-[^-]*$//')"
          echo "plasma-nm $version"
          plasma/fetch-upstream-headers.sh "$version" /tmp/plasma-nm-headers
          python3 plasma/check-interface.py /tmp/plasma-nm-headers
      - name: Build package
        run: packaging/debian/build-plasma-deb.sh dist
      - uses: actions/upload-artifact@v7
        with:
          name: deb-plasma-package
          path: dist/*.deb
          if-no-files-found: error

  deb-install:
    needs: [deb, deb-plasma]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: "debian:trixie"
            plasma: true
          - image: "ubuntu:24.04"
            plasma: false
          - image: "ubuntu:26.04"
            plasma: true
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: deb-*
          path: dist
          merge-multiple: true
      - name: Install and smoke test
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y ./dist/networkmanager-openp2s_*.deb
          nm-openp2s --version
          out="$(/usr/lib/nm-openp2s/openvpn --version || true)"
          head -1 <<<"$out"
          grep -q '^OpenVPN 2' <<<"$out"
          test -f /usr/lib/NetworkManager/VPN/nm-openp2s-service.name
      - name: Install Plasma support
        if: matrix.plasma
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get install -y ./dist/plasma-nm-openp2s_*.deb
          plugin="$(dpkg -L plasma-nm-openp2s | grep 'plasma/network/vpn/.*\.so$')"
          echo "$plugin"
          ! ldd "$plugin" | grep 'not found'

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [arch, deb-install]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
