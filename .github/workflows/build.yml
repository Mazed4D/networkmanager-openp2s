name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-dbus python3-gi gir1.2-nm-1.0 gir1.2-secret-1
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Version consistency
        run: |
          source packaging/PKGBUILD
          code="$(python3 -c 'import nm_openp2s; print(nm_openp2s.__version__)')"
          echo "PKGBUILD: $pkgver  code: $code"
          test "$pkgver" = "$code"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "${GITHUB_REF#refs/tags/v}" = "$pkgver"
          fi

  arch:
    needs: test
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v7
      - name: Build package
        run: |
          pacman -Syu --noconfirm
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder: "$GITHUB_WORKSPACE"
          cd packaging
          sudo -u builder makepkg --syncdeps --noconfirm
      - name: Install and smoke test
        run: |
          pacman -U --noconfirm packaging/*.pkg.tar.zst
          nm-openp2s --version
          out="$(/usr/lib/nm-openp2s/openvpn --version || true)"
          head -1 <<<"$out"
          grep -q '^OpenVPN 2' <<<"$out"
          test -f /usr/lib/NetworkManager/VPN/nm-openp2s-service.name
      - uses: actions/upload-artifact@v7
        with:
          name: arch-package
          path: packaging/*.pkg.tar.zst
          if-no-files-found: error

  deb:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build package
        run: packaging/debian/build-deb.sh dist
      - uses: actions/upload-artifact@v7
        with:
          name: deb-package
          path: dist/*.deb
          if-no-files-found: error

  deb-install:
    needs: deb
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:trixie", "ubuntu:24.04", "ubuntu:26.04"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: deb-package
          path: dist
      - name: Install and smoke test
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y ./dist/*.deb
          nm-openp2s --version
          out="$(/usr/lib/nm-openp2s/openvpn --version || true)"
          head -1 <<<"$out"
          grep -q '^OpenVPN 2' <<<"$out"
          test -f /usr/lib/NetworkManager/VPN/nm-openp2s-service.name

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [arch, deb-install]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
